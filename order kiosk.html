<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Kiosk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        .kiosk-container {
            display: flex;
            height: 100vh;
        }
        
        .menu-section {
            flex: 3;
            padding: 20px;
            background-color: white;
            overflow-y: auto;
        }
        
        .cart-section {
            flex: 1;
            padding: 20px;
            background-color: #ffc72c;
            display: flex;
            flex-direction: column;
        }
        
        .menu-categories {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        
        .category-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: #666;
        }
        
        .category-btn.active {
            color: #da291c;
            border-bottom: 3px solid #da291c;
        }
        
        .menu-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .menu-item {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            background-color: white;
        }
        
        .menu-item:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .menu-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
        }
        
        .item-name {
            font-weight: bold;
            margin: 10px 0 5px;
        }
        
        .item-price {
            color: #da291c;
            font-weight: bold;
        }
        
        .add-btn {
            background-color: #da291c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .cart-title {
            font-size: 24px;
            font-weight: bold;
            color: #da291c;
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .item-controls {
            display: flex;
            align-items: center;
        }
        
        .quantity-btn {
            background-color: #da291c;
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .item-quantity {
            margin: 0 10px;
        }
        
        .cart-total {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            text-align: right;
        }
        
        .checkout-btn {
            background-color: #da291c;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        
        .checkout-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .receipt-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .receipt {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
        }
        
        .receipt-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .receipt-title {
            color: #da291c;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .receipt-items {
            margin-bottom: 20px;
        }
        
        .receipt-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .receipt-total {
            font-weight: bold;
            font-size: 18px;
            border-top: 1px dashed #333;
            padding-top: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        
        .close-receipt {
            background-color: #da291c;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            margin-top: 20px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="kiosk-container">
        <!-- Menu Section -->
        <div class="menu-section">
            <div class="menu-categories">
                <button class="category-btn active" data-category="burgers">Burgers</button>
                <button class="category-btn" data-category="chicken">Chicken</button>
                <button class="category-btn" data-category="fries">Fries & Sides</button>
                <button class="category-btn" data-category="drinks">Drinks</button>
                <button class="category-btn" data-category="desserts">Desserts</button>
            </div>
            
            <div class="menu-items" id="menu-items-container">
                <!-- Menu items will be loaded here dynamically -->
            </div>
        </div>
        
        <!-- Cart Section -->
        <div class="cart-section">
            <div class="cart-header">
                <div class="cart-title">Your Order</div>
                <div class="cart-count">0 items</div>
            </div>
            
            <div class="cart-items" id="cart-items-container">
                <!-- Cart items will be loaded here dynamically -->
                <div class="empty-cart">Your cart is empty</div>
            </div>
            
            <div class="cart-total">
                Total: $<span id="cart-total">0.00</span>
            </div>
            
            <button class="checkout-btn" id="checkout-btn" disabled>Checkout</button>
        </div>
    </div>
    
    <!-- Receipt Modal -->
    <div class="receipt-container" id="receipt-container">
        <div class="receipt">
            <div class="receipt-header">
                <div class="receipt-title">McDonald's</div>
                <div>123 Main St, Anytown</div>
                <div>Order #<span id="order-number">1001</span></div>
                <div id="order-date">May 1, 2023 12:34 PM</div>
            </div>
            
            <div class="receipt-items" id="receipt-items">
                <!-- Receipt items will be loaded here -->
            </div>
            
            <div class="receipt-total">
                <span>Total:</span>
                <span>$<span id="receipt-total">0.00</span></span>
            </div>
            
            <button class="close-receipt" id="close-receipt">Close</button>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Menu data
            const menuItems = {
                burgers: [
                    { id: 1, name: "Big Mac", price: 4.99, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Big-Mac.jpg" },
                    { id: 2, name: "Quarter Pounder", price: 5.49, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Quarter-Pounder-with-Cheese.jpg" },
                    { id: 3, name: "Cheeseburger", price: 1.99, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Cheeseburger.jpg" },
                    { id: 4, name: "McDouble", price: 2.49, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-McDouble.jpg" }
                ],
                chicken: [
                    { id: 5, name: "McChicken", price: 2.99, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-McChicken.jpg" },
                    { id: 6, name: "Chicken McNuggets (10 pc)", price: 5.99, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Chicken-McNuggets-10-Pc-Meals.jpg" },
                    { id: 7, name: "Spicy McChicken", price: 3.29, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-spicy-McChicken.jpg" }
                ],
                fries: [
                    { id: 8, name: "World Famous Fries (Large)", price: 2.49, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Fries-Medium.jpg" },
                    { id: 9, name: "Apple Slices", price: 1.29, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Apple-Slices.jpg" }
                ],
                drinks: [
                    { id: 10, name: "Coca-Cola (Medium)", price: 1.99, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Coca-Cola-Classic-Medium.jpg" },
                    { id: 11, name: "Iced Coffee", price: 2.49, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Iced-Coffee-Medium.jpg" },
                    { id: 12, name: "Sprite (Medium)", price: 1.99, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Sprite-Medium.jpg" }
                ],
                desserts: [
                    { id: 13, name: "Vanilla Cone", price: 1.49, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Vanilla-Ice-Cream-Cone.jpg" },
                    { id: 14, name: "McFlurry (Oreo)", price: 3.29, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Oreo-McFlurry.jpg" },
                    { id: 15, name: "Apple Pie", price: 1.29, image: "https://www.mcdonalds.com/is/image/content/dam/usa/nfl/assets/meal/desktop/t-mcdonalds-Apple-Pie.jpg" }
                ]
            };
            
            // Cart data
            let cart = [];
            
            // Initialize the menu
            loadMenuItems('burgers');
            
            // Category button click handler
            $('.category-btn').click(function() {
                $('.category-btn').removeClass('active');
                $(this).addClass('active');
                const category = $(this).data('category');
                loadMenuItems(category);
            });
            
            // Load menu items for a category
            function loadMenuItems(category) {
                const items = menuItems[category];
                const $container = $('#menu-items-container');
                $container.empty();
                
                items.forEach(item => {
                    $container.append(`
                        <div class="menu-item" data-id="${item.id}">
                            <img src="${item.image}" alt="${item.name}">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">$${item.price.toFixed(2)}</div>
                            <button class="add-btn" data-id="${item.id}">Add</button>
                        </div>
                    `);
                });
                
                // Add click handler for add buttons
                $('.add-btn').click(function() {
                    const id = parseInt($(this).data('id'));
                    addToCart(id);
                });
            }
            
            // Add item to cart
            function addToCart(id) {
                // Find the item in all categories
                let item = null;
                for (const category in menuItems) {
                    item = menuItems[category].find(i => i.id === id);
                    if (item) break;
                }
                
                if (!item) return;
                
                // Check if item already in cart
                const existingItem = cart.find(i => i.id === id);
                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    cart.push({
                        ...item,
                        quantity: 1
                    });
                }
                
                updateCart();
            }
            
            // Update cart display
            function updateCart() {
                const $container = $('#cart-items-container');
                $container.empty();
                
                if (cart.length === 0) {
                    $container.append('<div class="empty-cart">Your cart is empty</div>');
                    $('#checkout-btn').prop('disabled', true);
                } else {
                    let total = 0;
                    
                    cart.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        total += itemTotal;
                        
                        $container.append(`
                            <div class="cart-item" data-id="${item.id}">
                                <div class="item-name">${item.name}</div>
                                <div class="item-controls">
                                    <button class="quantity-btn minus-btn" data-id="${item.id}">-</button>
                                    <span class="item-quantity">${item.quantity}</span>
                                    <button class="quantity-btn plus-btn" data-id="${item.id}">+</button>
                                    <span class="item-total">$${itemTotal.toFixed(2)}</span>
                                </div>
                            </div>
                        `);
                    });
                    
                    // Update total
                    $('#cart-total').text(total.toFixed(2));
                    $('.cart-count').text(`${cart.reduce((sum, item) => sum + item.quantity, 0)} items`);
                    $('#checkout-btn').prop('disabled', false);
                    
                    // Add click handlers for quantity buttons
                    $('.minus-btn').click(function() {
                        const id = parseInt($(this).data('id'));
                        updateQuantity(id, -1);
                    });
                    
                    $('.plus-btn').click(function() {
                        const id = parseInt($(this).data('id'));
                        updateQuantity(id, 1);
                    });
                }
            }
            
            // Update item quantity in cart
            function updateQuantity(id, change) {
                const itemIndex = cart.findIndex(i => i.id === id);
                if (itemIndex === -1) return;
                
                cart[itemIndex].quantity += change;
                
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                
                updateCart();
            }
            
            // Checkout button click handler
            $('#checkout-btn').click(function() {
                showReceipt();
            });
            
            // Show receipt
            function showReceipt() {
                const $container = $('#receipt-items');
                $container.empty();
                
                let total = 0;
                
                cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    
                    $container.append(`
                        <div class="receipt-item">
                            <div>
                                <div>${item.name}</div>
                                <div>${item.quantity} x $${item.price.toFixed(2)}</div>
                            </div>
                            <div>$${itemTotal.toFixed(2)}</div>
                        </div>
                    `);
                });
                
                // Update receipt total
                $('#receipt-total').text(total.toFixed(2));
                
                // Generate random order number
                $('#order-number').text(Math.floor(1000 + Math.random() * 9000));
                
                // Set current date/time
                const now = new Date();
                const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                $('#order-date').text(now.toLocaleDateString('en-US', options));
                
                // Show receipt
                $('#receipt-container').fadeIn();
            }
            
            // Close receipt button click handler
            $('#close-receipt').click(function() {
                $('#receipt-container').fadeOut();
                // Clear cart after checkout
                cart = [];
                updateCart();
            });
        });
    </script>
</body>
</html>
